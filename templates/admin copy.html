<!DOCTYPE html>
<html lang="fr">

<script>
if (value === 'Résolue') {
      Swal.fire({
        text: "Voulez-vous marquer cette demande comme résolue et informer le client ?",
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Oui',
        cancelButtonText: 'Annuler',
        reverseButtons: true,
        focusCancel: true
      }).then((result) => {
        if (result.isConfirmed) {
          // 👉 nouvelle route Flask qui fait tout
          fetch(`${base}/resolve_and_notify/${id}`, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
              if (data.status === 'ok') {
                Swal.fire({
                  icon: 'success',
                  title: 'Demande résolue',
                  text: 'Le client a été notifié.',
                  timer: 2500,
                  showConfirmButton: false
                });
              } else {
                Swal.fire({
                  icon: 'error',
                  title: 'Erreur',
                  text: data.message || "Une erreur est survenue."
                });
              }
            })
            .catch(() => {
              Swal.fire({
                icon: 'error',
                title: 'Erreur réseau',
                text: "Impossible de contacter le serveur."
              });
            });
        } else {
          // si annulé => on remet l'ancien statut
          currentStatusTarget.textContent = oldValue;
          currentStatusTarget.className = `badge status-badge ${getStatusClass(oldValue)}`;
        }
      });
      
</script>
</body>
</html>
