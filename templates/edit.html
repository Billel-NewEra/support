<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modifier une intervention</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
  <h2>✏️ Modifier l'intervention #{{ d[1] }}</h2>
  <form method="POST" class="mt-3">

    <div class="mb-3">
      <label class="form-label">Téléphone</label>
      <input type="text" name="telephone" class="form-control" value="{{ d[4] }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ d[5] }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Titre</label>
      <input type="text" name="titre" class="form-control" value="{{ d[6] }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="4">{{ d[7] }}</textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Type de support</label>
      <input type="text" name="type_support" class="form-control" value="{{ d[8] }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Détail support</label>
      <input type="text" name="detail_support" class="form-control" value="{{ d[9] }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Autre détail</label>
      <input type="text" name="autre_detail" class="form-control" value="{{ d[10] }}">
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="express" id="express" {% if d[11] == 1 %}checked{% endif %}>
      <label class="form-check-label" for="express">
        🚀 Service express
      </label>
    </div>

    <button type="submit" class="btn btn-primary">💾 Enregistrer</button>
    <a href="{{ url_for('admin') }}" class="btn btn-secondary">⬅ Retour</a>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
