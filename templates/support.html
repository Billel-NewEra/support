{% extends "base.html" %}
{% block title %}Demande de support - Mobibenz{% endblock %}

{% block head_extra %}
<!-- Select2 CSS -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<style>
  .form-box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 30px;
    max-width: 850px;
    width: 100%;
    color: #fff;
    box-shadow: 0 0 30px rgba(0,0,0,0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
    margin-top: 150px;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeInUp 0.8s ease forwards;
    animation-delay: 0.3s;
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .form-box h2 {
    text-align: center;
    color: #fff;
    margin-bottom: 25px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  h4 {
    font-size: 1.1rem;
    font-weight: 700;
    color: rgb(80, 121, 82);
    margin-bottom: 8px;
    margin-top: 20px;
    text-transform: uppercase;
    border-bottom: 2px solid var(--vert);
    padding-bottom: 4px;
  }

  .form-label {
    font-weight: 600;
    font-size: 0.95rem;
    color: #fff;
  }

  .form-control,
  .form-select {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .form-control:focus,
  .form-select:focus {
    background: rgba(255, 255, 255, 0.25);
    outline: none;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    color: #fff;
  }

  .form-control::placeholder { color: #eee; }

  .alert {
    font-size: 0.9rem;
    padding: 8px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .btn-envoyer {
    background: linear-gradient(135deg, var(--vert), #0ea645);
    border: none;
    font-size: 0.9rem;
    padding: 10px 30px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 auto;
    box-shadow: 0 4px 15px rgba(12, 139, 62, 0.4);
    transition: all 0.2s ease-in-out;
    color: #fff;
    cursor: pointer;
  }

  .btn-envoyer:hover {
    background: linear-gradient(135deg, #0ea645, var(--vert));
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(12, 139, 62, 0.5);
  }

  .btn-envoyer i { font-size: 1rem; }

  #support-alert-wrapper {
    width: 100%;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.4s ease;
  }

  #support-alert-wrapper.show {
    opacity: 1;
    transform: translateY(0);
  }

  #support-alert {
    background: rgba(255, 255, 255, 0.15);
    color: #ffdf91;
    border: 1px solid rgba(255, 255, 255, 0.25);
    font-weight: 500;
    font-size: 0.9rem;
    padding: 12px 15px;
    margin-top: 5px;
    border-radius: 8px;
    text-align: center;
  }

  #support-alert .form-check {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 6px;
  }

  #support-alert .form-check-label {
    margin-left: 6px;
  }

  select, select option {
    color: #1f1f1f;
    background-color: #ffffff;
  }

  .form-select {
    background-color: #5283c9 !important;
    color: #ffffff;
    border: 1px solid #3a6fb6;
    border-radius: 6px;
    font-size: 0.95rem;
    transition: all 0.2s ease-in-out;
  }

  .form-select:valid { color: #e7f59a; }

  /* 💄 Style harmonisé pour Select2 */
  .select2-container--default .select2-selection--single {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    height: 38px;
    display: flex;
    align-items: center;
    border-radius: 6px;
  }
  .select2-container--default .select2-selection--single .select2-selection__rendered {
    color: #fff;
    line-height: 38px;
  }
  .select2-container--default .select2-selection--single .select2-selection__arrow b {
    border-color: #fff transparent transparent transparent;
  }
  .select2-dropdown { background: #fff; color: #000; border-radius: 6px; }
  .select2-search__field { color: #000; }
  .select2-container--default.select2-container--focus .select2-selection--single {
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  }
</style>
{% endblock %}

{% block content %}
<div class="form-box">
  <h2>Demande de support</h2>
  <form action="{{ url_for('submit') }}" method="POST">

    <h4>Informations client</h4>
    <div class="mb-3">
      <label class="form-label">Êtes-vous déjà client ? *</label>
      <div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="client_exist" id="clientOui" value="oui" required>
          <label class="form-check-label" for="clientOui">Oui</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="client_exist" id="clientNon" value="non">
          <label class="form-check-label" for="clientNon">Non</label>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Entreprise *</label>
          <input type="text" id="entrepriseInput" name="entreprise" class="form-control" required>
          <select id="entrepriseSelect" class="form-select d-none"></select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Nom du contact *</label>
          <input type="text" name="contact_nom" class="form-control" required>
        </div>
      </div>
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Téléphone *</label>
          <input type="tel" name="telephone" class="form-control" required>
        </div>
      </div>
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Adresse e-mail</label>
          <input type="email" name="email" class="form-control">
        </div>
      </div>
    </div>

    <h4>Informations sur la demande</h4>
    <div class="row g-3">
      <div class="col-12">
        <div class="mb-3">
          <label class="form-label">Titre de la demande *</label>
          <input type="text" name="titre" class="form-control" required>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="mb-3">
          <label class="form-label">Type de support *</label>
          <select name="type_support" id="type_support" class="form-select" required>
            <option value="">-- Sélectionner --</option>
            <option value="Sur site">Support sur site</option>
            <option value="À distance">Support à distance</option>
            <option value="Reparation">Réparation</option>
            <option value="Commande">Commande de produits</option>
          </select>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="mb-3">
          <label class="form-label">Détail *</label>
          <select name="detail_support" id="detail_support" class="form-select" required>
            <option value="">-- Sélectionner --</option>
          </select>
        </div>
      </div>

      <div class="col-12 d-none" id="autre_detail_container">
        <div class="mb-3">
          <label class="form-label">Détail supplémentaire</label>
          <input type="text" name="autre_detail" class="form-control">
        </div>
      </div>

      <div class="col-12 d-none" id="support-alert-wrapper">
        <div id="support-alert" class="alert">
          <div id="support-message" class="mb-2"></div>
          <div class="form-check d-none" id="express-container">
            <input class="form-check-input" type="checkbox" id="express-option" name="express">
            <label class="form-check-label text-light" for="express-option">
              L'option Service express (intervention sous 24 h) est disponible avec un supplément de <strong>5000 DA</strong>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" required>
      <label class="form-check-label text-light">
        J'accepte que 
        <span style="color: rgb(244, 244, 10); vertical-align: baseline">
          des frais de déplacement
        </span> 
        puissent être facturés selon la nature de l'intervention.
      </label>
    </div>

    <button type="submit" class="btn-envoyer">
      <i class="fa-solid fa-paper-plane"></i>
      Envoyer
    </button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
const entreprisesExistantes = [
  "NOVOPRINT",
  "CONCEPT EMBALLAGE",
  "SALPAC EMBALLAGE",
  "SIEMENS",
  "SPLENDID",
  "NAFTAL",
  "CTC",
  "TECHNOETIQUETTE",
  "PHARMA PRINT SOLUTION",
  "FLEXO MONDE",
  "CUBE COMMUNICATION",
  "DEMIDEM CONTRUCTION",
  "SMART ART",
  "SRID",
  "SYNGENTA",
  "AQUASCHOOL",
  "EL MORCHID EDITION",
  "GT SPORT",
  "AMBASSADE DE KOREA",
  "THE CAMPUS",
  "BIO SANTE MED",
  "ASCOMEDIC",
  "SOON LAB",
  "BAOUALI LABORATOIRE",
  "SPA ELFATH",
  "MOUSSAOUI INDUSTRY",
  "MEDIUS",
  "DJEDID EMBALLAGE",
  "DEV PACK",
  "AGRICHEM",
  "EURL RIMANES",
  "IMPRIMERIE OURAHMOUNE",
  "CUBE TRADING"
];

const radioOui = document.getElementById('clientOui');
const radioNon = document.getElementById('clientNon');
const inputEntreprise = document.getElementById('entrepriseInput');
const selectEntreprise = document.getElementById('entrepriseSelect');
let select2Initialized = false;

// Remplissage des options
entreprisesExistantes.forEach(nom => {
  const opt = document.createElement('option');
  opt.value = nom;
  opt.textContent = nom;
  selectEntreprise.appendChild(opt);
});

function modeNouveauClient() {
  if (select2Initialized) {
    $(selectEntreprise).select2('destroy');
    select2Initialized = false;
  }
  selectEntreprise.classList.add('d-none');
  selectEntreprise.removeAttribute('name');
  selectEntreprise.required = false;

  inputEntreprise.classList.remove('d-none');
  inputEntreprise.setAttribute('name', 'entreprise');
  inputEntreprise.required = true;
  inputEntreprise.value = '';
}

function modeClientExistant() {
  inputEntreprise.classList.add('d-none');
  inputEntreprise.removeAttribute('name');
  inputEntreprise.required = false;

  selectEntreprise.classList.remove('d-none');
  selectEntreprise.setAttribute('name', 'entreprise');
  selectEntreprise.required = true;

  if (!select2Initialized) {
    $(selectEntreprise).select2({
      placeholder: "Sélectionnez une entreprise",
      allowClear: false,
      width: '100%'
    });

    // 🪄 Ajout du focus automatique sur le champ de recherche
    $(selectEntreprise).on('select2:open', () => {
      document.querySelector('.select2-search__field').focus();
    });
    
    select2Initialized = true;
  }
  $(selectEntreprise).val('').trigger('change');
}

radioOui.addEventListener('change', modeClientExistant);
radioNon.addEventListener('change', modeNouveauClient);
modeNouveauClient();

// ------- Logique support (inchangée) -------
const typeSelect = document.getElementById('type_support');
const detailSelect = document.getElementById('detail_support');
const autreContainer = document.getElementById('autre_detail_container');
const autreInput = autreContainer.querySelector('input[name="autre_detail"]');
const alertWrapper = document.getElementById('support-alert-wrapper');
const supportMessage = document.getElementById('support-message');
const expressContainer = document.getElementById('express-container');
const expressOption = document.getElementById('express-option');

let errorAlert = null;
function showError(message) {
  if (!errorAlert) {
    errorAlert = document.createElement('div');
    errorAlert.className = 'alert alert-danger mt-2';
    errorAlert.style.fontSize = '0.9rem';
    autreContainer.appendChild(errorAlert);
  }
  errorAlert.textContent = message;
  errorAlert.classList.remove('d-none');
}
function hideError() { if (errorAlert) errorAlert.classList.add('d-none'); }

const options = {
  "Sur site": ["Installation", "Maintenance", "Assistance technique", "Autre"],
  "À distance": ["Assistance logicielle", "Diagnostic", "Mise à jour", "Autre"],
  "Reparation": [],
  "Commande": []
};

typeSelect.addEventListener('change', () => {
  // Reset des champs
  detailSelect.innerHTML = '<option value="">-- Sélectionner --</option>';
  alertWrapper.classList.add('d-none');
  alertWrapper.classList.remove('show');
  expressContainer.classList.add('d-none');
  expressOption.checked = false;

  autreContainer.classList.add('d-none');
  autreInput.value = '';
  autreInput.removeAttribute('required');
  hideError();

  const selectedType = typeSelect.value;

  // 👉 Cas spécial : Commande produits
  if (selectedType === "Commande" || selectedType === "Reparation") {
    // On cache le champ "Détail"
    detailSelect.closest('.mb-3').classList.add('d-none');
    detailSelect.removeAttribute('required');

    // On affiche le champ "Détail supplémentaire" directement
    autreContainer.classList.remove('d-none');
    autreInput.setAttribute('required', 'required');
    return;
  } else {
    // Si ce n'est pas Commande, on réaffiche le champ Détail
    detailSelect.closest('.mb-3').classList.remove('d-none');
    detailSelect.setAttribute('required', 'required');
  }

  // Options dynamiques selon le type
  if (options[selectedType]) {
    options[selectedType].forEach(opt => {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt;
      detailSelect.appendChild(o);
    });
  }

  // Message et option express pour "Sur site"
  if (selectedType === "Sur site") {
    supportMessage.textContent = "⚠️ Veillez noter que des frais de déplacement de minimum 3000 DA s'ajoutent au coût de la prestation.";
    alertWrapper.classList.remove('d-none');
    setTimeout(() => alertWrapper.classList.add('show'), 20);
    expressContainer.classList.remove('d-none');
  }
});

detailSelect.addEventListener('change', () => {
  // Si Autre est choisi
  if (detailSelect.value === "Autre") {
    autreContainer.classList.remove('d-none');
    autreInput.setAttribute('required', 'required');
  } else {
    autreContainer.classList.add('d-none');
    autreInput.value = '';
    autreInput.removeAttribute('required');
    hideError();
  }
});

detailSelect.addEventListener('change', () => {
  if (detailSelect.value === "Autre") {
    autreContainer.classList.remove('d-none');
    autreInput.setAttribute('required', 'required');
  } else {
    autreContainer.classList.add('d-none');
    autreInput.value = '';
    autreInput.removeAttribute('required');
    hideError();
  }
});

document.querySelector('form').addEventListener('submit', (e) => {
  const isAutre = detailSelect.value === "Autre";
  if (isAutre && autreInput.value.trim() === '') {
    e.preventDefault();
    autreInput.focus();
    showError("Veuillez préciser le détail supplémentaire.");
  }
});
</script>
{% endblock %}
