<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demande de support - Mobibenz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .support-wrapper {
      max-width: 800px;
      margin: 40px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 25px;
    }
    .support-header {
      text-align: center;
      margin-bottom: 25px;
    }
    .support-header img {
      height: 80px;
      margin-bottom: 10px;
    }
    .support-header h2 {
      text-transform: uppercase;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }
    .form-label {
      font-weight: 600;
      color: var(--dark);
      font-size: 13px;
    }
    .form-control, .form-select {
      font-size: 14px;
      padding: 10px;
      border-radius: 6px;
    }
    .form-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px 20px;
    }
    @media (max-width: 768px) {
      .form-section {
        grid-template-columns: 1fr;
      }
    }
    .alert {
      font-size: 14px;
      border-radius: 6px;
    }
    .submit-btn {
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      width: 100%;
    }
    .submit-btn:hover {
      background: #08712f;
    }
  </style>
</head>
<body class="bg-light">

<div class="support-wrapper">
  <!-- 🧭 En-tête -->
  <div class="support-header">
    <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Mobibenz Logo">
    <h2>Demande de support</h2>
  </div>

  <!-- 📩 Formulaire -->
  <form action="{{ url_for('submit') }}" method="POST">

    <!-- 📌 Section infos client -->
    <div class="form-section mb-3">
      <div>
        <label class="form-label">Entreprise *</label>
        <input type="text" name="entreprise" class="form-control" required>
      </div>
      <div>
        <label class="form-label">Nom du contact *</label>
        <input type="text" name="contact_nom" class="form-control" required>
      </div>
      <div>
        <label class="form-label">Téléphone *</label>
        <input type="tel" name="telephone" class="form-control" required>
      </div>
      <div>
        <label class="form-label">Adresse e-mail</label>
        <input type="email" name="email" class="form-control">
      </div>
    </div>

    <!-- 📌 Section description -->
    <div class="mb-3">
      <label class="form-label">Titre *</label>
      <input type="text" name="titre" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description *</label>
      <textarea name="description" class="form-control" rows="5" maxlength="5000" required></textarea>
      <small class="text-muted">Max 5000 caractères</small>
    </div>

    <!-- 📌 Section support -->
    <div class="form-section mb-3">
      <div>
        <label class="form-label">Type de support *</label>
        <select name="type_support" id="type_support" class="form-select" required>
          <option value="">-- Sélectionner --</option>
          <option value="Sur site">Support sur site</option>
          <option value="À distance">Support à distance</option>
          <option value="Livraison">Livraison</option>
        </select>
      </div>
      <div>
        <label class="form-label">Détail *</label>
        <select name="detail_support" id="detail_support" class="form-select" required>
          <option value="">-- Sélectionner --</option>
        </select>
      </div>
    </div>

    <div class="mb-3 d-none" id="autre_detail_container">
      <label class="form-label">Détail supplémentaire</label>
      <input type="text" name="autre_detail" class="form-control">
    </div>

    <!-- ⚠️ Tarif -->
    <div class="alert alert-warning text-center">
      ⚠️ Tout déplacement pour support est facturé <strong>3000 DA</strong>.
    </div>

    <!-- ✅ Validation -->
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" required>
      <label class="form-check-label">
        J’ai lu et j’accepte la politique d’intervention.
      </label>
    </div>

    <button type="submit" class="submit-btn">📤 Envoyer la demande</button>
  </form>
</div>

<script>
const typeSelect = document.getElementById('type_support');
const detailSelect = document.getElementById('detail_support');
const autreContainer = document.getElementById('autre_detail_container');

const options = {
  "Sur site": ["Installation", "Maintenance", "Assistance technique", "Autre"],
  "À distance": ["Assistance logicielle", "Diagnostic", "Mise à jour", "Autre"],
  "Livraison": ["Livraison standard", "Installation sur place", "Autre"]
};

typeSelect.addEventListener('change', () => {
  detailSelect.innerHTML = '<option value="">-- Sélectionner --</option>';
  if (options[typeSelect.value]) {
    options[typeSelect.value].forEach(opt => {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt;
      detailSelect.appendChild(o);
    });
  }
});

detailSelect.addEventListener('change', () => {
  if (detailSelect.value === "Autre") {
    autreContainer.classList.remove('d-none');
  } else {
    autreContainer.classList.add('d-none');
  }
});
</script>
</body>
</html>
