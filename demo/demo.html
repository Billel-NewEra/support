<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table avec Modal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .table-container {
      max-width: 1000px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .table-hover tbody tr {
      cursor: pointer;
    }
    .modal-header {
      background: #0d6efd;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="table-container">
  <h4 class="mb-3">📋 Liste des interventions</h4>
  <table class="table table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Numéro</th>
        <th>Entreprise</th>
        <th>Titre</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody>
      <tr onclick="showModal(1)">
        <td>1</td>
        <td>MBZ-20251014-0001</td>
        <td>CUBE</td>
        <td>Installation réseau</td>
        <td><span class="badge bg-warning text-dark">En attente</span></td>
      </tr>
      <tr onclick="showModal(2)">
        <td>2</td>
        <td>MBZ-20251014-0002</td>
        <td>ABC</td>
        <td>Problème imprimante</td>
        <td><span class="badge bg-success">Résolue</span></td>
      </tr>
    </tbody>
  </table>
</div>

<!-- 🪟 Modal -->
<div class="modal fade" id="detailsModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Détails de l’intervention</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <dl class="row">
          <dt class="col-sm-3">Entreprise</dt>
          <dd class="col-sm-9" id="m-entreprise"></dd>

          <dt class="col-sm-3">Contact</dt>
          <dd class="col-sm-9" id="m-contact"></dd>

          <dt class="col-sm-3">Téléphone</dt>
          <dd class="col-sm-9" id="m-telephone"></dd>

          <dt class="col-sm-3">Email</dt>
          <dd class="col-sm-9" id="m-email"></dd>

          <dt class="col-sm-3">Titre</dt>
          <dd class="col-sm-9" id="m-titre"></dd>

          <dt class="col-sm-3">Description</dt>
          <dd class="col-sm-9" id="m-description"></dd>

          <dt class="col-sm-3">Type</dt>
          <dd class="col-sm-9" id="m-type"></dd>

          <dt class="col-sm-3">Express</dt>
          <dd class="col-sm-9" id="m-express"></dd>

          <dt class="col-sm-3">Date</dt>
          <dd class="col-sm-9" id="m-date"></dd>
        </dl>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const modal = new bootstrap.Modal(document.getElementById('detailsModal'));

const data = {
  1: {
    entreprise: "CUBE",
    contact: "Omar",
    telephone: "+213 555 555 555",
    email: "omar@gmail.com",
    titre: "Installation réseau",
    description: "Installation d'un nouveau réseau interne.",
    type: "Sur site",
    express: "Oui",
    date: "2025-10-14 14:22:00"
  },
  2: {
    entreprise: "ABC",
    contact: "Karim",
    telephone: "+213 666 666 666",
    email: "karim@abc.com",
    titre: "Problème imprimante",
    description: "L'imprimante ne répond pas depuis ce matin.",
    type: "À distance",
    express: "Non",
    date: "2025-10-13 09:15:00"
  }
};

function showModal(id) {
  document.getElementById('m-entreprise').innerText = data[id].entreprise;
  document.getElementById('m-contact').innerText = data[id].contact;
  document.getElementById('m-telephone').innerText = data[id].telephone;
  document.getElementById('m-email').innerText = data[id].email;
  document.getElementById('m-titre').innerText = data[id].titre;
  document.getElementById('m-description').innerText = data[id].description;
  document.getElementById('m-type').innerText = data[id].type;
  document.getElementById('m-express').innerText = data[id].express;
  document.getElementById('m-date').innerText = data[id].date;
  modal.show();
}
</script>

</body>
</html>
